<svg xmlns="http://www.w3.org/2000/svg" width="800" height="568" viewBox="0 0 800 568" role="img" aria-labelledby="t d"><title id="t">Findings model accuracy by class</title><desc id="d">Horizontal bars of AP50 per finding class. Good: implant, impacted tooth, crown, filling. Mid: caries, root piece, maxillary sinus, mandibular canal. Bad: root canal treatment, missing teeth, periapical lesion. Broken: bone loss and 12 rare classes.</desc><style>
