<svg xmlns="http://www.w3.org/2000/svg" width="760" height="388" viewBox="0 0 760 388" role="img" aria-labelledby="t d"><title id="t">Findings model confidence versus accuracy</title><desc id="d">Dumbbell chart. Scores 0.5-0.6 are correct 29.5% of the time, 0.6-0.7 34.7%, 0.7-0.8 41.1%, 0.8-0.9 57.7%, 0.9-1.0 89.1%.</desc><style>
