.t1{fill:#1f2328} .t2{fill:#59636e} .t3{fill:#818b98}
.grid{stroke:#d8dee4;stroke-width:1} .axis{stroke:#8c959f;stroke-width:1}
.ref{stroke:#8c959f;stroke-width:1;stroke-dasharray:4 4}
.s1{fill:#2a78d6} .s1s{stroke:#2a78d6}
.ink2s{stroke:#59636e} .ink2f{fill:#59636e}
.ring{stroke:#ffffff;stroke-width:2}
@media (prefers-color-scheme: dark){
