}
</style><rect class="bg" x="0.5" y="0.5" width="759" height="387" rx="12"/><text class="t1" x="24" y="36" font-size="17" font-weight="600">Findings model: confidence vs. reality</text><text class="t2" x="24" y="58" font-size="13">For each score range, the average score shown next to how often those findings were actually correct.</text><circle cx="30" cy="84" r="6" fill="none" stroke-width="2" class="ink2s"/><text class="t1" x="42" y="88" font-size="12">Average score the model gave</text><circle class="s1 ring" cx="236" cy="84" r="6"/><text class="t1" x="248" y="88" font-size="12">Share actually correct</text><text class="t2" x="664" y="104" font-size="12">Overstated by</text><line class="grid" x1="174.0" y1="112" x2="174.0" y2="332"/><text class="t3" x="174.0" y="348" font-size="11" text-anchor="middle">0%</text><line class="grid" x1="291.5" y1="112" x2="291.5" y2="332"/><text class="t3" x="291.5" y="348" font-size="11" text-anchor="middle">25%</text><line class="grid" x1="409.0" y1="112" x2="409.0" y2="332"/><text class="t3" x="409.0" y="348" font-size="11" text-anchor="middle">50%</text><line class="grid" x1="526.5" y1="112" x2="526.5" y2="332"/><text class="t3" x="526.5" y="348" font-size="11" text-anchor="middle">75%</text><line class="grid" x1="644.0" y1="112" x2="644.0" y2="332"/><text class="t3" x="644.0" y="348" font-size="11" text-anchor="middle">100%</text><text class="t1" x="150" y="133.0" font-size="13" text-anchor="end">Score 0.5–0.6</text><text class="t3" x="150" y="148.0" font-size="11" text-anchor="end">421 findings</text><line x1="312.6" y1="134.0" x2="432.5" y2="134.0" stroke-width="2" class="ink2s" opacity="0.5"/><circle cx="432.5" cy="134.0" r="6" fill="none" stroke-width="2" class="ink2s"/><circle class="s1 ring" cx="312.6" cy="134.0" r="7"/><text class="t2" x="312.6" y="122.0" font-size="11" text-anchor="middle">29.5%</text><text class="t1" x="664" y="138.0" font-size="13" font-weight="600">~25 pts</text><text class="t1" x="150" y="177.0" font-size="13" text-anchor="end">Score 0.6–0.7</text><text class="t3" x="150" y="192.0" font-size="11" text-anchor="end">464 findings</text><line x1="337.1" y1="178.0" x2="479.5" y2="178.0" stroke-width="2" class="ink2s" opacity="0.5"/><circle cx="479.5" cy="178.0" r="6" fill="none" stroke-width="2" class="ink2s"/><circle class="s1 ring" cx="337.1" cy="178.0" r="7"/><text class="t2" x="337.1" y="166.0" font-size="11" text-anchor="middle">34.7%</text><text class="t1" x="664" y="182.0" font-size="13" font-weight="600">~30 pts</text><text class="t1" x="150" y="221.0" font-size="13" text-anchor="end">Score 0.7–0.8</text><text class="t3" x="150" y="236.0" font-size="11" text-anchor="end">530 findings</text><line x1="367.2" y1="222.0" x2="526.5" y2="222.0" stroke-width="2" class="ink2s" opacity="0.5"/><circle cx="526.5" cy="222.0" r="6" fill="none" stroke-width="2" class="ink2s"/><circle class="s1 ring" cx="367.2" cy="222.0" r="7"/><text class="t2" x="367.2" y="210.0" font-size="11" text-anchor="middle">41.1%</text><text class="t1" x="664" y="226.0" font-size="13" font-weight="600">~34 pts</text><text class="t1" x="150" y="265.0" font-size="13" text-anchor="end">Score 0.8–0.9</text><text class="t3" x="150" y="280.0" font-size="11" text-anchor="end">777 findings</text><line x1="445.2" y1="266.0" x2="573.5" y2="266.0" stroke-width="2" class="ink2s" opacity="0.5"/><circle cx="573.5" cy="266.0" r="6" fill="none" stroke-width="2" class="ink2s"/><circle class="s1 ring" cx="445.2" cy="266.0" r="7"/><text class="t2" x="445.2" y="254.0" font-size="11" text-anchor="middle">57.7%</text><text class="t1" x="664" y="270.0" font-size="13" font-weight="600">~27 pts</text><text class="t1" x="150" y="309.0" font-size="13" text-anchor="end">Score 0.9–1.0</text><text class="t3" x="150" y="324.0" font-size="11" text-anchor="end">10,523 findings</text><line x1="592.8" y1="310.0" x2="634.6" y2="310.0" stroke-width="2" class="ink2s" opacity="0.5"/><circle cx="634.6" cy="310.0" r="6" fill="none" stroke-width="2" class="ink2s"/><circle class="s1 ring" cx="592.8" cy="310.0" r="7"/><text class="t2" x="592.8" y="298.0" font-size="11" text-anchor="middle">89.1%</text><text class="t1" x="664" y="314.0" font-size="13" font-weight="600">~9 pts</text><text class="t3" x="24" y="374" font-size="11">Only scores of 0.9 and above are close to honest (89% correct). The app does not yet adjust for this; see Known issues.</text></svg>
