name: Bug report
description: Something in ToothCare AI isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Issues are public. Never attach real patient X-rays, names or other personal information.**
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This report contains no patient images or personal information.
          required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows 10, Windows 11, macOS (Apple Silicon), Other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Backend log (optional)
      description: |
        Windows: `%APPDATA%\toothcareai\logs\backend.log` · macOS: `~/Library/Application Support/toothcareai/logs/backend.log`
      render: text
